spring:
  datasource:
    hikari:
      maximum-pool-size: 32
      connection-timeout: 30000
  flyway:
    enabled: true

# Tests call HoldExpirySweeper.sweep() directly. A background timer firing in the
# middle of a deliberately constructed expiry race would produce failures that look
# like concurrency bugs and are really just the test fighting itself.
turnstile:
  hold:
    sweep:
      enabled: false

logging:
  level:
    com.turnstile: INFO
    org.testcontainers: INFO
    com.github.dockerjava: WARN
