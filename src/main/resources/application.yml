spring:
  application:
    name: turnstile

  datasource:
    # Same env var as docker-compose.yml, so one variable moves both.
    url: jdbc:postgresql://localhost:${TURNSTILE_PG_PORT:5434}/turnstile
    username: turnstile
    password: turnstile
    hikari:
      pool-name: turnstile-pool
      maximum-pool-size: 32
      connection-timeout: 10000

  data:
    redis:
      host: localhost
      port: 6379
      # Generous on purpose: the fast path failing open is cheap, but a
      # timeout storm under load is not. Container round trips on macOS are
      # slower than they look.
      timeout: 2s

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Java 21 virtual threads for request handling.
  threads:
    virtual:
      enabled: true

server:
  port: 8080

turnstile:
  hold:
    ttl: PT5M
    sweep:
      enabled: true
      interval: PT10S
      # Bounded so one sweep cannot hold thousands of row locks in sequence
      # while live buyers wait behind them.
      batch-size: 500

  outbox:
    enabled: true
    interval: PT2S
    batch-size: 100

  reconciliation:
    enabled: true
    interval: PT1H

logging:
  level:
    com.turnstile: DEBUG
