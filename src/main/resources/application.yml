spring:
  application:
    name: turnstile

  datasource:
    url: jdbc:postgresql://localhost:5432/turnstile
    username: turnstile
    password: turnstile
    hikari:
      pool-name: turnstile-pool
      maximum-pool-size: 32
      connection-timeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Java 21 virtual threads for request handling.
  threads:
    virtual:
      enabled: true

server:
  port: 8080

turnstile:
  hold:
    ttl: PT5M

logging:
  level:
    com.turnstile: DEBUG
